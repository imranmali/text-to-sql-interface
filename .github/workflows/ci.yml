name: CI

on:
  push:
    branches:
      - main
      - "claude/**"
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        run: >-
          pytest
          --cov=text2sql
          --cov-report=xml
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-latest
    env:
      OPENSPEC_TELEMETRY: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec@1.14.3

      # Validates every active change and every main spec. Once all changes are
      # archived and nothing is left to validate, the CLI still exits 0.
      - name: Validate specs and changes
        run: openspec validate --all --strict --no-interactive

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: text2sql:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d -p 8000:8000 --name t2s text2sql:ci

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then
              echo
              echo "Service healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Service did not become healthy within 30s" >&2
          exit 1

      - name: Smoke test /api/query
        run: |
          response=$(curl -fsS -X POST http://localhost:8000/api/query \
            -H 'content-type: application/json' \
            -d '{"question":"How many customers are there?"}')
          echo "$response"
          echo "$response" | grep -q '"status":"success"'

      - name: Container logs
        if: failure()
        run: docker logs t2s

      - name: Stop container
        if: always()
        run: docker rm -f t2s || true
